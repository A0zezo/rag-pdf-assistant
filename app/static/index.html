<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG PDF Assistant</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  header { width: 100%; max-width: 860px; padding: 28px 20px 12px; }
  h1 { font-size: 1.4rem; }
  h1 span { color: #58a6ff; }
  .sub { color: #8b949e; font-size: .85rem; margin-top: 4px; }
  #upload { width: 100%; max-width: 860px; padding: 12px 20px; display: flex; gap: 10px; align-items: center; }
  input[type=file] { color: #8b949e; font-size: .85rem; }
  button { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 8px 18px; cursor: pointer; font-size: .9rem; }
  button:hover { background: #2ea043; }
  #status { font-size: .8rem; color: #8b949e; }
  #chat { width: 100%; max-width: 860px; flex: 1; padding: 12px 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { border-radius: 10px; padding: 12px 16px; font-size: .92rem; line-height: 1.5; white-space: pre-wrap; }
  .q { background: #1f6feb33; border: 1px solid #1f6feb66; align-self: flex-end; max-width: 80%; }
  .a { background: #161b22; border: 1px solid #30363d; max-width: 95%; }
  .cite { display: inline-block; background: #21262d; border: 1px solid #30363d; border-radius: 12px; padding: 2px 10px; margin: 6px 6px 0 0; font-size: .75rem; color: #58a6ff; }
  .mode { font-size: .7rem; color: #8b949e; margin-top: 6px; text-transform: uppercase; letter-spacing: .05em; }
  #ask { width: 100%; max-width: 860px; padding: 12px 20px 24px; display: flex; gap: 10px; }
  #question { flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px 14px; color: #e6edf3; font-size: .95rem; }
  #question:focus { outline: 1px solid #58a6ff; }
</style>
</head>
<body>
<header>
  <h1>RAG <span>PDF</span> Assistant</h1>
  <div class="sub">Hybrid retrieval (FAISS + BM25) over your PDFs, with page-level citations.</div>
</header>
<div id="upload">
  <input type="file" id="file" accept="application/pdf">
  <button onclick="ingest()">Index PDF</button>
  <span id="status"></span>
</div>
<div id="chat"></div>
<div id="ask">
  <input id="question" placeholder="Ask a question about the indexed PDFs..." onkeydown="if(event.key==='Enter')ask()">
  <button onclick="ask()">Ask</button>
</div>
<script>
const chat = document.getElementById('chat');
const status = document.getElementById('status');

function addMsg(cls, text, extra) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  if (extra) div.appendChild(extra);
  chat.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
  return div;
}

async function ingest() {
  const input = document.getElementById('file');
  if (!input.files.length) { status.textContent = 'Choose a PDF first.'; return; }
  const fd = new FormData();
  fd.append('file', input.files[0]);
  status.textContent = 'Indexing...';
  const res = await fetch('/api/ingest', { method: 'POST', body: fd });
  const data = await res.json();
  status.textContent = res.ok
    ? `Indexed ${data.file}: ${data.pages} pages, ${data.chunks_indexed} chunks (total ${data.total_chunks}).`
    : (data.detail || 'Ingest failed.');
}

const params = new URLSearchParams(location.search);

async function ask() {
  const box = document.getElementById('question');
  const question = box.value.trim();
  if (!question) return;
  box.value = '';
  addMsg('q', question);
  const thinking = addMsg('a', 'Thinking...');
  const res = await fetch('/api/query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question })
  });
  const data = await res.json();
  thinking.remove();
  if (!res.ok) { addMsg('a', data.detail || 'Query failed.'); return; }
  const extra = document.createElement('div');
  extra.innerHTML = data.citations.map(c =>
    `<span class="cite">${c.source} &middot; p.${c.page}</span>`).join('') +
    `<div class="mode">mode: ${data.mode}</div>`;
  addMsg('a', data.answer, extra);
}

// ?q=... pre-fills and asks a question on load (shareable question links)
if (params.get('q')) {
  document.getElementById('question').value = params.get('q');
  fetch('/api/health').then(r => r.json()).then(h => {
    if (h.chunks_indexed > 0) ask();
  });
}
</script>
</body>
</html>
